name: Verify application and module contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked dependencies
        run: npm run setup
      - name: Build bundled server
        run: npm run build
      - name: Verify JavaScript syntax
        run: |
          node --check 运行文件/dist/app.js
          node --check 运行文件/dist/charts.js
          node --check 运行文件/dist/import-page.js
          node --check 运行文件/dist/imported-workspace.js
          node --check 运行文件/serve.mjs
          node --check 运行文件/start-website.mjs
      - name: Verify business calculations
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract validator
        run: python -m pip install -r 开发文件/requirements-dev.txt
      - name: Verify contracts and examples
        run: python 开发文件/contracts/validate_examples.py
