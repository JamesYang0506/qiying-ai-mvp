name: Verify application and module contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/charts.js
          node --check serve.mjs
      - name: Verify business calculations
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract validator
        run: python -m pip install -r requirements-dev.txt
      - name: Verify contracts and examples
        run: python contracts/validate_examples.py
